---
# handlers file for nagios

- name: Reload nagios
  ansible.builtin.systemd:
    name: "nagios.service"
    state: reloaded
  delegate_to: "{{ item.hostname }}"
  loop: "{{ nagios_servers }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: Restart nrpe
  become: true
  ansible.builtin.systemd:
    name: nrpe.service
    state: restarted
    daemon_reload: true

---
- name: Render single-instance and multicluster configurations
  hosts: all
  gather_facts: false
  vars_files:
    - vars/main.yml
  tasks:
    - name: Exercise production input validation
      block:
        - name: Validate monitoring targets through the role
          ansible.builtin.include_role:
            name: "{{ nagios_molecule_fixture_role }}"
            tasks_from: validate

        - name: Require invalid targets to be rejected
          ansible.builtin.assert:
            that:
              - not (nagios_molecule_invalid | default(false) | bool)
      rescue:
        - name: Confirm the expected validation error
          ansible.builtin.assert:
            that:
              - nagios_molecule_invalid | default(false) | bool
              - ansible_failed_task.name == 'Validate PostgreSQL monitoring targets'
              - "'Nagios cluster targets need valid names' in (ansible_failed_result.results | map(attribute='msg') | join(' '))"

        - name: Record the rejected target
          ansible.builtin.copy:
            dest: "{{ nagios_molecule_output }}"
            content: '{"rejected": true}'
            mode: "0600"

    - name: Render configurations with the real role sources
      ansible.builtin.include_role:
        name: "{{ nagios_molecule_fixture_role }}"
        tasks_from: render
      when: not (nagios_molecule_invalid | default(false) | bool)

---
# Tests the role on Rocky Linux 9 and 10 in systemd containers, with nrpe and
# check_postgres from EPEL, against a local PostgreSQL server from the
# distribution (see prepare.yml). The role only configures hosts in the
# postgres group.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: podman
platforms:
  - name: nagios-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - postgres
  - name: nagios-el10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - postgres
provisioner:
  name: ansible
  inventory:
    host_vars:
      # EPEL 10 has no check_postgres package: prepare.yml installs
      # check_postgres.pl from upstream instead
      nagios-el10:
        nagios_packages:
          - nrpe
          - perl-Time-HiRes
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

---
- name: Prepare local configuration fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/main.yml
  tasks:
    - name: Create temporary fixture folders
      ansible.builtin.file:
        path: "{{ nagios_molecule_work }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - roles/nagios/tasks
        - scripts with spaces
        - bin

    # Load the real role defaults, variables, filters and templates without
    # executing package installation, database provisioning or service changes.
    - name: Link the role sources into the fixture
      ansible.builtin.file:
        src: "{{ nagios_molecule_project }}/{{ item }}"
        dest: "{{ nagios_molecule_work }}/roles/nagios/{{ item }}"
        state: link
      loop:
        - defaults
        - vars
        - filter_plugins
        - templates

    - name: Use the production target validation task
      ansible.builtin.copy:
        dest: "{{ nagios_molecule_work }}/roles/nagios/tasks/validate.yml"
        content: "{{ [((lookup('file', nagios_molecule_project ~ '/tasks/postgres.yml') | from_yaml) | first)] | to_nice_yaml }}"
        mode: "0600"

    - name: Install the fixture rendering entry point
      ansible.builtin.copy:
        src: tasks/render.yml
        dest: "{{ nagios_molecule_work }}/roles/nagios/tasks/render.yml"
        mode: "0600"

    - name: Load the actual administrative task as fixture variables
      ansible.builtin.copy:
        dest: "{{ nagios_molecule_work }}/user_task.yml"
        content: >-
          {{ {'nagios_molecule_user_task': (
               lookup('file', nagios_molecule_project ~ '/tasks/postgres.yml') | from_yaml
               | selectattr('name', 'equalto', 'Create an nrpe user in Postgres') | first
             )} | to_nice_yaml }}
        mode: "0600"

    - name: Copy the actual database wrapper
      ansible.builtin.copy:
        src: "{{ nagios_molecule_project }}/files/nrpe/pg_multi_db_checks.sh"
        dest: "{{ nagios_molecule_work }}/scripts with spaces/pg_multi_db_checks.sh"
        mode: "0700"

    - name: Install mock database commands
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ nagios_molecule_work }}/{{ item.dest }}"
        mode: "0700"
      loop:
        - src: files/psql
          dest: bin/psql
        - src: files/check_postgres_locks
          dest: scripts with spaces/check_postgres_locks

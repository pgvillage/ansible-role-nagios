---
- name: Load administrative parameters from the actual role task
  ansible.builtin.include_vars:
    file: "{{ nagios_molecule_work }}/user_task.yml"

- name: Render NRPE command groups
  ansible.builtin.set_fact:
    nagios_molecule_configs: >-
      {{ nagios_molecule_configs | default({})
         | combine({item.key: lookup('template', role_path ~ '/templates/' ~ item.key ~ '.j2')}) }}
  loop: "{{ nagios_checks | dict2items }}"

- name: Capture the actual administrative task parameters per cluster
  ansible.builtin.set_fact:
    nagios_molecule_users: >-
      {{ nagios_molecule_users | default([]) + [{
        'cluster': nagios_cluster.key,
        'service': nagios_molecule_user_task.environment.PGSERVICE,
        'port': nagios_molecule_user_task['community.postgresql.postgresql_user'].login_port | int,
        'ssl_mode': nagios_molecule_user_task['community.postgresql.postgresql_user'].ssl_mode,
        'name': nagios_molecule_user_task['community.postgresql.postgresql_user'].name,
        'run_once': nagios_molecule_user_task.run_once
      }] }}
  loop: "{{ __nagios_clusters | dict2items }}"
  loop_control:
    loop_var: nagios_cluster

- name: Save rendered configuration and connection parameters
  ansible.builtin.copy:
    dest: "{{ nagios_molecule_output }}"
    mode: "0600"
    content: >-
      {{ {
        'configs': nagios_molecule_configs,
        'central': lookup('template', role_path ~ '/templates/nagios_server_custom.cfg.j2'),
        'users': nagios_molecule_users
      } | to_json }}

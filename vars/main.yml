---
# vars file for nagios

# An empty target name preserves the legacy NRPE command identifiers.
__nagios_clusters: >-
  {{ nagios_clusters if nagios_clusters | length > 0 else {
    '': {
      'service': nagios_pg_service,
      'host': nagios_pg_host,
      'port': nagios_pg_port,
      'ssl_mode': nagios_pg_ssl_mode
    }
  } }}

# The mount points to run df on: the global ones and those of every cluster
__nagios_mount_points: >-
  {{ ([nagios_data_dir_mp, nagios_wal_dir_mp]
      + (__nagios_clusters.values() | selectattr('data_dir_mp', 'defined') | map(attribute='data_dir_mp') | list)
      + (__nagios_clusters.values() | selectattr('wal_dir_mp', 'defined') | map(attribute='wal_dir_mp') | list))
     | unique }}
